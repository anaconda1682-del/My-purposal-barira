<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Key & Lock Slide Animation with Heart Rain Behind</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
}

/* Background image */
body {
    position: relative;
    font-family: Arial, sans-serif;
    background: url('background.jpg') no-repeat center center/cover;
    background-attachment: fixed;
}

/* Dark overlay */
body::before {
    content: "";
    position: absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.4); /* adjust to make darker or lighter */
    z-index:1;
}

/* Floating Top Image */
#topImage {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 500px; /* adjust size */
    z-index: 2;
    animation: floatUpDown 3s ease-in-out infinite alternate;
}

@keyframes floatUpDown {
    0% { transform: translateX(-50%) translateY(0); }
    100% { transform: translateX(-50%) translateY(20px); }
}

/* Lock & Key */
#lock {
    width: 600px;
    height: 600px;
    position: absolute;
    top: 35%;
    left: 50%;
    transform: translateX(-50%);
    user-select: none;
    transition: opacity 1s ease;
    z-index: 2;
}

#key {
    width: 300px;
    height: 300px;
    position: absolute;
    bottom: 55px;
    left: 50%;
    transform: translateX(-50%);
    cursor: grab;
    touch-action: none;
    z-index: 2;
    transition: opacity 0.8s ease, transform 0.8s ease;
}

.glow { filter: drop-shadow(0 0 20px yellow); }
.shake { animation: shake 0.3s; }
@keyframes shake { 0%,100% { transform: translateX(-50%); } 20% { transform: translateX(-60%); } 40% { transform: translateX(-40%); } 60% { transform: translateX(-60%); } 80% { transform: translateX(-40%); } }

/* Glow effect for left/right images */
.glowImage {
    animation: imageGlow 1s infinite alternate;
}

@keyframes imageGlow {
    0% { filter: drop-shadow(0 0 5px yellow); }
    100% { filter: drop-shadow(0 0 20px yellow); }
}

/* Sparkles */
#sparkles { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden; z-index:2; }
.spark { position: absolute; width:5px; height:5px; background: yellow; border-radius:50%; pointer-events:none; opacity:1; animation: sparkle 0.6s linear forwards;}
@keyframes sparkle {0%{opacity:1; transform:translate(0,0) scale(1);} 100%{opacity:0; transform:translate(var(--dx), var(--dy)) scale(0);}}

/* Images */
#leftImage, #rightImage {
    position: absolute;
    width: 40%;
    height: auto;
    z-index:2;
    opacity: 0;
    transition: all 1.5s ease, opacity 1.2s ease;
}

/* Start positions */
#leftImage { top: -100%; left: 32%; transform: translate(-50%, -50%); } 
#rightImage { top: 200%; left: 68%; transform: translate(-50%, -50%); } 

/* Heart Rain */
#heartRain {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
    z-index:2;
}

.heart {
    position: absolute;
    font-size: 20px;
    color: red;
    animation: fall 2s linear forwards;
}

@keyframes fall {
    0% { transform: translateY(0) scale(1); opacity:1;}
    100% { transform: translateY(100vh) scale(1.2); opacity:0;}
}
</style>
</head>
<body>

<!-- Floating top image -->
<img id="topImage" src="top-image.png" alt="Floating Top Image">

<audio id="bgMusic" loop autoplay>
    <source src="music1.mp3" type="audio/mpeg">
</audio>

<div id="heartRain"></div>
<div id="sparkles"></div>

<img id="lock" src="lock.png" alt="Lock">
<img id="key" src="key.png" alt="Key">

<img id="leftImage" src="left-image.png" alt="Left Image">
<img id="rightImage" src="right-image.png" alt="Right Image">

<script>
const key = document.getElementById('key');
const lock = document.getElementById('lock');
const sparklesContainer = document.getElementById('sparkles');
const music = document.getElementById('bgMusic');
const leftImg = document.getElementById('leftImage');
const rightImg = document.getElementById('rightImage');
const heartContainer = document.getElementById('heartRain');

let dragging = false;
let offsetX=0, offsetY=0;
let musicStarted = false;

// Autoplay fallback
music.play().catch(()=>{
    document.addEventListener('mousedown',()=>music.play(), {once:true});
    document.addEventListener('touchstart',()=>music.play(), {once:true});
});

// Sparkle
function createSparkle(x,y){
    const spark=document.createElement('div');
    spark.classList.add('spark');
    spark.style.left = x+'px';
    spark.style.top = y+'px';
    spark.style.setProperty('--dx',(Math.random()*40-20)+'px');
    spark.style.setProperty('--dy',(Math.random()*40-20)+'px');
    sparklesContainer.appendChild(spark);
    setTimeout(()=>spark.remove(),600);
}

// Heart Rain Functions
function createHeart(){
    const heart = document.createElement('div');
    heart.classList.add('heart');
    heart.innerHTML = '❤️';
    heart.style.left = Math.random()*100 + 'vw';
    heart.style.fontSize = (Math.random()*20+15)+'px';
    heartContainer.appendChild(heart);
    setTimeout(()=>heart.remove(), 2000);
}

let heartInterval;
function startHeartRain(){ heartInterval = setInterval(createHeart, 200); }
function stopHeartRain(){ clearInterval(heartInterval); }

// Drag functions
function startDrag(e){
    dragging=true;
    key.style.cursor='grabbing';
    const clientX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
    const clientY = e.type.startsWith('touch') ? e.touches[0].clientY : e.clientY;
    const rect=key.getBoundingClientRect();
    offsetX = clientX - rect.left;
    offsetY = clientY - rect.top;
    e.preventDefault();
    if(!musicStarted){ music.play().catch(()=>{}); musicStarted=true; }
}

function drag(e){
    if(!dragging) return;
    const clientX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
    const clientY = e.type.startsWith('touch') ? e.touches[0].clientY : e.clientY;
    const x=clientX-offsetX;
    const y=clientY-offsetY;
    key.style.left=x+'px';
    key.style.top=y+'px';

    const keyRect=key.getBoundingClientRect();
    const lockRect=lock.getBoundingClientRect();
    const distance=Math.hypot(
        (keyRect.left+keyRect.width/2)-(lockRect.left+lockRect.width/2),
        (keyRect.top+keyRect.height/2)-(lockRect.top+lockRect.height/2)
    );
    if(distance<80) key.classList.add('glow'); else key.classList.remove('glow');

    createSparkle(keyRect.left+keyRect.width/2, keyRect.top+keyRect.height/2);
}

function endDrag(){
    if(!dragging) return;
    dragging=false;
    key.style.cursor='grab';
    key.classList.remove('glow');

    const keyRect=key.getBoundingClientRect();
    const lockRect=lock.getBoundingClientRect();
    const keyCenterX=keyRect.left+keyRect.width/2;
    const keyCenterY=keyRect.top+keyRect.height/2;
    const insideLockX = keyCenterX>lockRect.left && keyCenterX<lockRect.right;
    const insideLockY = keyCenterY>lockRect.top && keyCenterY<lockRect.bottom;

    if(insideLockX && insideLockY){
        key.style.opacity='0';
        lock.style.opacity='0';

        // Slide-in side images with glow
        leftImg.style.top='50%';
        leftImg.style.opacity='1';
        leftImg.style.left='32%';
        leftImg.style.transform='translate(-50%, -50%)';
        leftImg.classList.add('glowImage');

        rightImg.style.top='50%';
        rightImg.style.opacity='1';
        rightImg.style.left='68%';
        rightImg.style.transform='translate(-50%, -50%)';
        rightImg.classList.add('glowImage');

        // Start heart rain behind
        startHeartRain();

        // After 5 sec, slide images away and remove glow
        setTimeout(()=>{
            leftImg.style.transform='translate(-50%, 200%)';
            rightImg.style.transform='translate(-50%, -200%)';
            leftImg.classList.remove('glowImage');
            rightImg.classList.remove('glowImage');
            stopHeartRain();
        },5000);

        // New page after 6 sec
        setTimeout(()=>{ window.location.href='eid.html'; },6000);

    } else {
        key.classList.add('shake');
        setTimeout(()=> key.classList.remove('shake'),300);
        key.style.left='50%';
        key.style.top='calc(100% - 150px)';
        key.style.transform='translateX(-50%)';
    }
}

// Event Listeners
key.addEventListener('mousedown',startDrag);
key.addEventListener('touchstart',startDrag);
document.addEventListener('mousemove',drag);
document.addEventListener('touchmove',drag);
document.addEventListener('mouseup',endDrag);
document.addEventListener('touchend',endDrag);

</script>
</body>
</html>
